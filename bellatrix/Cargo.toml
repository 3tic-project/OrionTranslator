[package]
name = "bellatrix"
version = "0.1.1"
edition = "2021"
description = "Embedded NER model inference + glossary generation library"

[features]
default = ["wgpu"]
wgpu = ["burn/wgpu", "modernbert-ner/wgpu"]
ndarray = ["modernbert-ner/ndarray"]

[dependencies]
# Burn is retained only for the concrete WGPU pipeline type exposed by
# modernbert-ner. The old BERT model implementation is no longer compiled.
burn = { version = "0.20.1", default-features = false, features = [
  "std",
] }
modernbert-ner = { path = "../modernbert-ner", default-features = false }
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
betelgeuse = { path = "../betelgeuse" }
